# hyprlock — "Sealed in Stone": a carved fossil slab set into your fossil-bed wallpaper.
#
# The slab itself (frame, dividers, carved ammonites + trilobites, the password groove) is baked
# into lock/lock_bg.png, and the colors come from lock/colors.conf. Both are rebuilt for the
# current Quickshell theme by ~/.config/hypr/lock/make_lock.py (theme-sync.sh runs it).
# Label positions here must match the Y_* layout in make_lock.py.
# The previous (helios / lily print) version is hyprlock.conf.pre-fossillock.

source = ~/.config/hypr/lock/colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.config/hypr/lock/lock_bg.png
}

# Time
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $lock_accent
    font_size = 104
    font_family = Boska Variable Medium
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(000000aa)
    position = 0, 190
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A · %-d %B %Y"
    color = $lock_textLight
    font_size = 19
    font_family = Recia Variable
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(00000099)
    position = 0, 100
    halign = center
    valign = center
}

# Heading
label {
    monitor =
    text = Sealed in Stone
    color = $lock_accent
    font_size = 32
    font_family = Boska Variable Medium
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(00000088)
    position = 0, 12
    halign = center
    valign = center
}
label {
    monitor =
    text = <i>welcome back, $USER</i>
    color = $lock_textSoft
    font_size = 16
    font_family = Recia Variable
    position = 0, -30
    halign = center
    valign = center
}

# Password field (sits in the groove carved in the slab)
input-field {
    monitor =
    size = 360, 50
    outline_thickness = 1
    rounding = 6
    outer_color = $lock_accentDark
    inner_color = $lock_field
    font_color = $lock_textLight
    font_family = Recia Variable
    check_color = $lock_accent
    fail_color = $lock_danger
    capslock_color = $lock_warning
    placeholder_text = <i>speak the word of passage…</i>
    fail_text = <i>the stone holds — $ATTEMPTS failed</i>
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    dots_rounding = -2
    fade_on_empty = false
    hide_input = false
    position = 0, -110
    halign = center
    valign = center
}
