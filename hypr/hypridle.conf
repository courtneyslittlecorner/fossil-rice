# hypridle — screensaver, then lock, and always lock before the laptop sleeps (e.g. lid closes).
# It holds a logind "delay" inhibitor, so suspend waits until hyprlock is up.
# Video players / browsers playing video inhibit idle, so these won't fire mid-film.
# Previous version (lock-before-sleep only): hypridle.conf.pre-screensaver

general {
    lock_cmd = ~/.config/hypr/lock.sh               # what `loginctl lock-session` runs
    before_sleep_cmd = loginctl lock-session       # lock before suspend
}

# 5 min idle: the Mare Antiquum screensaver (ammonites + trilobites); any input ends it
listener {
    timeout = 300
    on-timeout = ~/.config/quickshell-screensaver/screensaver.sh start
    on-resume = ~/.config/quickshell-screensaver/screensaver.sh stop
}

# 15 min idle: lock the screen (hyprlock, "Sealed in Stone")
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}
