font_family Monaco
font_size 11
scrollback_lines 3000

# Change font size: ctrl+shift+plus / ctrl+shift+minus
map ctrl+shift+plus change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0

# Colors follow the Quickshell theme. This file is regenerated by
# ~/.config/hypr/theme-sync.sh (via theme-apps.py) on every theme change.
include current-theme.conf
